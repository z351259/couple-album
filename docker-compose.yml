version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: couple-album-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: couple
      POSTGRES_PASSWORD: couple123
      POSTGRES_DB: couple_album
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - couple-album

  redis:
    image: redis:7-alpine
    container_name: couple-album-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - couple-album

volumes:
  postgres_data:
  redis_data:

networks:
  couple-album:
    driver: bridge
